AWSTemplateFormatVersion: '2010-09-09'
Description: Route53 Hosted Zone and AWS SES v2 Identity Setup for herbertng.com

Parameters:
  DomainName:
    Type: String
    Default: herbertng.com
    Description: The primary domain name
  MailFromSubDomain:
    Type: String
    Default: mail
    Description: Subdomain prefix used for SES custom MAIL FROM (e.g. mail.herbertng.com).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The ID of your existing Route 53 Public Hosted Zone (e.g., Z0123456789ABCDEF).

Resources:
  # ------------------------------------------------------------
  # 2. Amazon SES v2 Domain Identity & Easy DKIM
  # ------------------------------------------------------------
  SESDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Sub "${MailFromSubDomain}.${DomainName}"
        BehaviorOnMxFailure: REJECT_MESSAGE
  # ------------------------------------------------------------
  # 3. Route 53 DKIM CNAME Records (Auto-wired from SES)
  # ------------------------------------------------------------
  DkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESDomainIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SESDomainIdentity.DkimDNSTokenValue1
  DkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESDomainIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SESDomainIdentity.DkimDNSTokenValue2

  DkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESDomainIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SESDomainIdentity.DkimDNSTokenValue3
  # ------------------------------------------------------------
  # 4. Custom MAIL FROM Domain DNS Records
  # ------------------------------------------------------------
  MailFromMXRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubDomain}.${DomainName}."
      Type: MX
      TTL: 300
      ResourceRecords:
        - !Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"

  MailFromSPFRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubDomain}.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'
  # ------------------------------------------------------------
  # 5. Root Domain SPF & DMARC Policies
  # ------------------------------------------------------------
  RootSPFRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  DMARCRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_dmarc.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"v=DMARC1; p=none; pct=100; sp=none;"'

  # ============================================================
  # 5. Inbound S3 Bucket & Permissions
  # ============================================================
  InboundMailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  InboundMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboundMailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSESPuts
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${InboundMailBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
Outputs:
  SESIdentityArn:
    Description: ARN of the SES Domain Identity
    Value: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}"
